<style>
.ascii {
    font-family: "Courier New", monospace;
    font-size: 10px;
    font-weight: bold;
    fill: #c9d1d9;
}

.row {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    animation:
        typeRow 0.35s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes typeRow {
    0% {
        opacity: 0;
        clip-path: inset(0 100% 0 0);
    }

    10% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        clip-path: inset(0 0 0 0);
    }
}
</style>

